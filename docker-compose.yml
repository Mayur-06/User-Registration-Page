services:
  db:
    image: postgres:16-alpine
    container_name: user-registration-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: user-registration-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://appuser:devpassword@db:5432/appdb
      JWT_SECRET: supersecretjwtkey
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend-1
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: user-registration-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
